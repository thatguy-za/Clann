services:
  clann:
    # Prebuilt multi-arch image published to GHCR on each GitHub release.
    # Pin to a version (e.g. ghcr.io/thatguy-za/clann:0.1) for reproducible
    # deploys, or keep :latest to always pull the newest release.
    image: ghcr.io/thatguy-za/clann:latest
    # To build locally from source instead, comment out `image:` above and
    # uncomment the line below:
    # build: .
    container_name: clann
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Public origin of the app. REQUIRED in production behind a proxy —
      # SvelteKit's form-action CSRF check compares the request Origin to this.
      # Set it to the exact URL users visit, e.g. https://tree.example.com
      ORIGIN: http://localhost:3000
      # Paths inside the container (kept on the volume below).
      DATABASE_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - clann_data:/data

volumes:
  clann_data:
