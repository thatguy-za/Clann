services:
  clann:
    # Prebuilt multi-arch image published to GHCR on each GitHub release.
    # Pin to a version (e.g. ghcr.io/thatguy-za/clann:0.1) for reproducible
    # deploys, or keep :latest to always pull the newest release.
    image: ghcr.io/thatguy-za/clann:latest
    # To build locally from source instead, comment out `image:` above and
    # uncomment the line below:
    # build: .
    container_name: clann
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # No ORIGIN needed: the app works on any host/port and behind a reverse
      # proxy out of the box. Session cookies are marked Secure automatically
      # when the request arrives over HTTPS (proxy sets x-forwarded-proto).
      #
      # Optional: set ORIGIN to your exact public URL to force Secure cookies,
      # e.g. ORIGIN: https://tree.example.com
      #
      # Paths inside the container (kept on the volume below).
      DATABASE_PATH: /data/app.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - clann_data:/data

volumes:
  clann_data:
